server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so /admin loads the same app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API goes to the backend service (docker-compose service name "api")
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
